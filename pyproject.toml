[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    # Hits real provider APIs. NEVER runs in CI — a test that calls Yahoo is a
    # test that goes red on a bad afternoon and teaches the team to ignore red
    # builds. Run deliberately: pytest -m live
    "live: requires network access to real data providers",
]

[tool.ruff]
target-version = "py311"
exclude = [".venv", "venv", "data"]

[tool.ruff.lint]
# Phase 0 posture: catch real bugs (syntax errors, undefined names,
# f-string / assert mistakes), not style. Tighten later (see migration plan).
select = ["E9", "F63", "F7", "F82"]
