name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-backend.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff — bug rules only)
        run: ruff check .

      # Run the invariant suite as its own step, BEFORE the general suite.
      # It is the required check: these are the rules that must hold for every
      # ticker, and a failure here means a number on a screen is wrong, not
      # that a unit test drifted. Separating it means the CI log says which
      # kind of failure happened without anyone reading the output.
      #
      # -rxX surfaces xfail/xpass in the summary: an xfail that starts passing
      # (XPASS) is a strict failure, which is how a fixed defect forces its
      # marker to be removed instead of silently rotting.
      - name: Invariants (required — tests/invariants)
        run: pytest tests/invariants -q -rxX

      - name: Run tests
        run: pytest --ignore=tests/invariants -m "not live"

  # The frontend tests. These had NEVER run in CI: the pipeline ran ruff and
  # pytest only, so 1267 vitest tests and the whole Playwright suite were
  # enforced solely by whoever remembered to run them locally. Every
  # behavioural guarantee added on the client — the session model, the
  # coalescing that keeps the dashboard to one request, the accessibility
  # gates, the banned-claim check on public copy — was unguarded.
  # NODE VERSION: taken from frontend/.nvmrc, not pinned inline.
  #
  # The first CI run of this job failed for exactly this reason, which is the
  # best argument for the job existing. It was pinned to Node 20 while this was
  # developed on Node 22, and three jsdom-environment test files failed to
  # START — not to assert, to start:
  #
  #   TypeError: webidl.util.markAsUncloneable is not a function
  #     at new CacheStorage (undici/lib/web/cache/cachestorage.js)
  #     at jsdom/lib/api.js
  #
  # jsdom pulls in undici, which needs a Node 22+ internal. 48 of 51 files
  # passed, so the failure looked like flake rather than a version mismatch.
  # A literal in three places is a thing that drifts; a file both sides read
  # is not.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Read from frontend/.nvmrc rather than pinned here, in three
          # places, where it had already drifted. See the note below.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

      # A broken production build is the one failure that cannot be caught by
      # unit tests and takes the site down on the next push, since Vercel
      # deploys this branch.
      - name: Production build
        run: npm run build

  # The browser suite, in its own job because it needs both servers and a
  # browser and takes ~10 minutes — long enough that bundling it with the
  # fast checks would make every push wait on it.
  #
  # NOT a required check yet, and the reason is honest rather than lazy: three
  # specs depend on live market-data providers and fail when those are
  # unreachable, which in CI they always are. They pass in isolation and fail
  # in sequence against a shared data dir. Making this blocking before that
  # coupling is fixed would train people to ignore a red build, which is worse
  # than not having it. It runs, it reports, and the flakes are named below.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          # Read from frontend/.nvmrc rather than pinned here, in three
          # places, where it had already drifted. See the note below.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-backend.txt

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the FastAPI backend and the Next dev
      # server itself via its webServer block, so there is nothing to launch
      # here. It also raises the login rate limit, which the suite needs
      # because it signs in once per test.
      - name: Playwright
        working-directory: frontend
        env:
          # playwright.config.ts defaults to .venv/bin/python, which does not
          # exist on a runner.
          PYTHON: python
        run: npx playwright test --reporter=line

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Dependency CVEs, as a separate job so it runs in parallel with the tests
  # and a vulnerable transitive package cannot hide behind a green test run.
  #
  # ADVISORY, not blocking (continue-on-error). That is deliberate: a new
  # advisory lands on someone else's schedule, and a gate that turns the whole
  # pipeline red for an unrelated CVE in a transitive dev dependency is a gate
  # people start ignoring or deleting. The job's job is to put the list in
  # front of whoever is looking. Turn off continue-on-error once the backlog
  # is at zero and it can be kept there.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: pip-audit (Python dependencies)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt -r requirements-backend.txt \
                    -r requirements-dev.txt --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          # Read from frontend/.nvmrc rather than pinned here, in three
          # places, where it had already drifted. See the note below.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (frontend dependencies)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=moderate
