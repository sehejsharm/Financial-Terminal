# RETIRED as the primary deploy path — the VM now deploys ITSELF.
#
# A systemd timer on the VM (deploy/autodeploy.sh, installed by
# deploy/install-autodeploy.sh) checks origin every 4 minutes and rebuilds
# on new commits. No SSH from CI, no secrets to corrupt, nothing to wedge:
# just push to the branch and the VM picks it up within ~4 minutes.
#
# This workflow is kept ONLY as a manual fallback (Actions tab -> Run
# workflow) for the rare case where the timer itself is broken. It requires
# the SSH_HOST / SSH_USER / SSH_PRIVATE_KEY repo secrets to be valid.
name: deploy-backend-manual-fallback

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd ~/Financial-Terminal
            git fetch origin
            git checkout claude/stock-market-dashboard-2BBMA
            git reset --hard origin/claude/stock-market-dashboard-2BBMA
            cd deploy
            sudo docker compose up -d --build
            sleep 10
            sudo docker compose ps

      - name: Verify health
        run: |
          sleep 20
          curl -fsS --max-time 20 https://sehejmotherboard.duckdns.org/healthz
