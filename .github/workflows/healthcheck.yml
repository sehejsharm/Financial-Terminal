# Uptime monitor: green run = app healthy, red run = something's wrong.
# Runs from GitHub's servers every 15 minutes, so the app's health is
# observable from the Actions tab (and by Claude via the GitHub API) without
# anyone touching the VM.
name: healthcheck

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    # Job-level, because a step's `if` is evaluated before that step's own
    # `env` block exists — declaring these inside the step would make the
    # condition always false.
    env:
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      API: https://sehejmotherboard.duckdns.org
    steps:
      # Needed by the version comparison below, which has to know what the
      # branch is at.
      - uses: actions/checkout@v4

      - name: Backend /healthz
        run: |
          curl -fsS --max-time 20 "$API/healthz"
          echo

      # Which commit is actually live.
      #
      # APP_VERSION was hardcoded to "oracle-1", so /version reported the same
      # string whatever was deployed — on a service that redeploys every four
      # minutes. deploy/autodeploy.sh now stamps the short commit SHA, and
      # printing it here puts "what is running right now" in a log anyone can
      # read without SSH, which is exactly what you want to know first when
      # something looks wrong.
      - name: Deployed version
        run: |
          curl -fsS --max-time 20 "$API/version" \
            | python3 -c 'import json,sys; v=json.load(sys.stdin); print("live:", v.get("version"), "| cache:", (v.get("cache") or {}).get("backend"))'

      # A deploy that rolled back leaves the branch ahead of what is running.
      # That is the state most worth noticing and the one nothing reports: the
      # push looked fine, CI was green, and the VM quietly went back.
      - name: Warn if the branch is ahead of what is deployed
        run: |
          LIVE=$(curl -fsS --max-time 20 "$API/version" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')
          HEAD=$(git rev-parse --short HEAD)
          if [ "$LIVE" = "unstamped" ]; then
            echo "::notice::backend reports an unstamped version — deployed by hand rather than by autodeploy"
          elif [ -n "$LIVE" ] && [ "$LIVE" != "$HEAD" ]; then
            echo "::warning::branch is at $HEAD but $LIVE is live. Either a deploy is still in flight, or autodeploy rolled back — check /var/log/mb-autodeploy.log on the VM."
          else
            echo "deployed commit matches the branch ($HEAD)"
          fi

      # /diag now requires a master-admin token (it disclosed which provider
      # keys are configured plus raw upstream error text to anyone who asked,
      # and each hit makes four live calls to metered providers — this probe
      # alone was ~96 free quota hits a day).
      #
      # So it logs in first, and it only runs when the credentials are
      # present: without them the step is skipped rather than failing, which
      # keeps the /healthz probe above as the signal and stops a missing
      # secret from showing up as a red "app is down" run.
      #
      # To enable it, set the ADMIN_USER and ADMIN_PASSWORD repo secrets to
      # the master-admin credentials from deploy/.env.
      - name: Backend /diag (provider status)
        if: ${{ env.ADMIN_PASSWORD != '' }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS --max-time 20 -X POST "$API/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$ADMIN_USER\",\"password\":\"$ADMIN_PASSWORD\"}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          # Report only which providers are reachable. The raw body carries
          # upstream error strings and key-configuration flags, and these logs
          # are more widely readable than the endpoint now is.
          curl -fsS --max-time 30 "$API/diag" \
            -H "Authorization: Bearer $TOKEN" \
            | python3 .github/scripts/diag_summary.py
