services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      BACKEND_CORS_ORIGINS: "http://localhost:3000,http://localhost:8501"
    volumes:
      # Share the data dir (users, watchlists, audit log) with the host so
      # restarts persist locally. In prod this is a managed volume.
      - ../data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
