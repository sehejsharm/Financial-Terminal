# Motherboard backend on an Oracle Cloud "Always Free" VM (Mumbai).
#
# Two containers:
#   • backend — the FastAPI app (private; only reachable inside the compose net)
#   • caddy   — public reverse proxy that terminates TLS (auto Let's Encrypt)
#
# Port 8000 is never exposed to the internet — only Caddy's 80/443 are. Caddy
# fetches and auto-renews an HTTPS cert for your DuckDNS domain.
#
#   cp .env.example .env        # then fill in .env (gitignored, never committed)
#   bash setup.sh               # or: sudo docker compose up -d --build
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_VERSION=oracle-1
      - REDIS_URL=redis://redis:6379/0   # shared cache; survives backend restarts
    depends_on:
      - redis
    # Cap memory so a runaway scan OOMs THIS container (Docker restarts it via
    # the restart policy) instead of the kernel killing random VM processes.
    mem_limit: 768m
    # Mark the container unhealthy when /healthz stops answering — the host
    # watchdog cron (deploy/watchdog.sh, installed by setup.sh) restarts it.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=6).status==200 else 1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    volumes:
      - ./data:/app/data        # persists users / watchlists / audit / jwt secret
    expose:
      - "8000"                  # internal only — reachable by Caddy, not the world

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru",
              "--save", ""]     # pure cache: no persistence, LRU eviction
    mem_limit: 80m
    expose:
      - "6379"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}        # e.g. motherboard-sehej.duckdns.org (from .env)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # Let's Encrypt certs — persist across restarts
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
